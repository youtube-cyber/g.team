<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.Team | Exquisite Digital Identity</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fdfdfd; /* 象牙白背景，比纯白更高级 */
            color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 防止出现滚动条 */
        }

        /* 装饰性细边框 */
        .border-box {
            position: fixed;
            top: 40px;
            left: 40px;
            right: 40px;
            bottom: 40px;
            border: 1px solid #e5e5e5;
            pointer-events: none; /* 允许点击边框内的元素 */
            z-index: 10;
        }

        .main-content {
            text-align: center;
            z-index: 20;
            padding: 0 30px;
        }

        /* 顶部小字：Available for Acquisition */
        .status-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.45em; /* 超宽字间距，尽显高级 */
            color: #aaa;
            margin-bottom: 30px;
            display: block;
            font-weight: 400;
        }

        /* 中心超大域名：G.Team - 大写首字母更显品牌感 */
        .domain-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(5rem, 18vw, 10rem); /* 响应式超大字体 */
            font-weight: 700;
            margin: 0;
            line-height: 1.0; /* 大写需要略微增加行高以平衡视觉 */
            color: #000;
            letter-spacing: -2px; /* 紧凑的字间距，更具冲击力 */
        }

        /* 副标题：The definitive identity for your collective. */
        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic; /* 意大利斜体，非常优雅 */
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: #4a4a4a;
            margin-top: 15px;
            margin-bottom: 70px; /* 留出足够的空间给分割线 */
            font-weight: 400;
        }

        /* 装饰性水平分割线 */
        .divider {
            width: 80px;
            height: 1px;
            background-color: #1a1a1a;
            margin: 0 auto 60px; /* 留出空间给下方的按钮 */
        }

        /* 联系链接：DIRECT INQUIRY → */
        .contact-link {
            font-size: 0.85rem;
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 6px;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* 悬停效果：文字变淡，下划线变淡，字间距略微变宽 */
        .contact-link:hover {
            color: #888;
            border-bottom-color: #888;
            letter-spacing: 0.25em;
        }

        /* 底部信息 */
        .footer-info {
            position: absolute;
            bottom: 80px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            color: #ccc;
        }

        /* 移动端优化：调整边框、字体和间距 */
        @media (max-width: 768px) {
            .border-box { top: 20px; left: 20px; right: 20px; bottom: 20px; }
            .domain-title { font-size: 4rem; }
            .subtitle { margin-bottom: 50px; }
            .divider { margin-bottom: 40px; }
            .footer-info { bottom: 50px; }
        }
    </style>
</head>
<body>

    <div class="border-box"></div>

    <div class="main-content">
        <span class="status-label">Available for Acquisition</span>
        <h1 class="domain-title">G.Team</h1>
        <p class="subtitle">The definitive identity for your collective.</p>
        
        <div class="divider"></div>
        
        <a href="mailto:1@g.team" class="contact-link">DIRECT INQUIRY &rarr;</a>
    </div>

    <div class="footer-info">
        ESTABLISHED 2026 &nbsp;|&nbsp; SECURE TRANSFER
    </div>

</body>
</html>
